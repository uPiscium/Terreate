version = 1

[classification]
retryable_http_status = [429]
usage_markers = [
  "rate limit",
  "rate_limit_exceeded",
  "usage limit",
  "usage_limit",
  "quota exceeded",
  "quota_exceeded",
  "freeusagelimiterror",
  "too many requests",
]
non_fallback_markers = [
  "authentication",
  "unauthorized",
  "forbidden",
  "permission denied",
  "context length",
  "context window",
  "validation error",
  "invalid request",
  "tool error",
  "safety",
]

[roles.build]
primary_agent = "build"
primary_model = "openai/gpt-5.6-sol"
fallback_agents = ["build-fallback"]
fallback_models = ["openai/gpt-5.6-terra"]
automatic = false

[roles.architect]
primary_agent = "architect"
primary_model = "openai/gpt-5.6-sol"
fallback_agents = ["architect-fallback"]
fallback_models = ["openai/gpt-5.6-terra"]
automatic = true

[roles.task-orchestrator]
primary_agent = "task-orchestrator"
primary_model = "openai/gpt-5.3-codex-spark"
fallback_agents = ["task-orchestrator-fallback"]
fallback_models = ["openai/gpt-5.6-sol"]
automatic = true

