[paths]
automation_core = [
  "opencode.json",
  "AGENTS.md",
  "Justfile",
  ".opencode/**",
  ".automation/**",
  ".github/workflows/**",
]
secret_patterns = [
  ".env",
  "credentials",
  "secret",
  "id_rsa",
  "id_ed25519",
  ".pem",
  ".key",
]

[publication]
remote = "origin"
pr_draft_by_default = true
merge_method = "squash"
